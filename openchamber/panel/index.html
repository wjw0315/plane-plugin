<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#121519; --card:#171b20; --line:#252b33; --line2:#2f3742;
    --fg:#e6e9ee; --fg2:#9aa4b2; --fg3:#6b7482; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
  }
  body[data-theme="light"]{
    --bg:#fff; --panel:#f7f8fa; --card:#fff; --line:#e5e7eb; --line2:#d1d5db;
    --fg:#111827; --fg2:#4b5563; --fg3:#9ca3af;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;
    display:flex; flex-direction:column; min-width:280px;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  h1{font-size:12px;margin:0;font-weight:600;letter-spacing:.02em}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--fg3);flex:0 0 6px}
  .dot.on{background:var(--ok)}
  .grow{flex:1}
  header select{appearance:none;background:var(--card);border:1px solid var(--line2);color:var(--fg2);
    border-radius:6px;font-size:11px;padding:2px 6px;max-width:140px}
  header button{background:var(--card);border:1px solid var(--line2);color:var(--fg2);border-radius:6px;
    font-size:11px;padding:2px 7px;cursor:pointer}
  header button:hover{color:var(--fg)}
  main{flex:1;min-height:0;overflow:auto;padding:12px;position:relative}
  .hint{color:var(--fg3);font-size:12px;text-align:center;padding:24px 8px}
  .empty{border:1px dashed var(--line2);border-radius:12px;padding:16px 14px;text-align:center;color:var(--fg2);font-size:11.5px}
  .empty .t{font-size:12.5px;color:var(--fg);margin-bottom:6px}
  .err{margin:8px 0;color:var(--err);font-size:11px;line-height:1.6;word-break:break-word}
  .acts{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .acts button,.form button{background:var(--card);border:1px solid var(--line2);color:var(--fg2);
    border-radius:7px;font-size:11px;padding:4px 10px;cursor:pointer}
  .acts button:hover,.form button:hover{color:var(--fg)}
  .form button[type=submit]{background:#1d2733;border-color:#3b5163;color:#dbe6f0}
  .form{display:flex;flex-direction:column;gap:9px}
  .form .t{font-size:12.5px;margin-bottom:2px}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--fg3)}
  .form input{background:var(--card);border:1px solid var(--line2);border-radius:7px;color:var(--fg);
    font-size:12px;padding:5px 7px}
  .form input::placeholder{color:var(--fg3)}
  .fine{color:var(--fg3);font-size:10.5px;line-height:1.6;margin-top:4px}
  .list{display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:8px;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--fg2);cursor:pointer;font:inherit}
  .row:hover{border-color:var(--line2);color:var(--fg)}
  .row.sel{border-color:#3b5163;background:#141c25}
  .row .nm{font-size:12px;color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .idf{font-size:10.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
  footer{display:flex;align-items:center;gap:6px;padding:7px 12px;border-top:1px solid var(--line);
    font-size:11px;color:var(--fg3);background:var(--panel)}
  .crash{margin:8px 12px 0;padding:6px 8px;border:1px solid #4a2326;background:#241618;color:#f87171;
    border-radius:8px;font-size:11px;white-space:pre-wrap}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
  .seg button{border:0;background:var(--card);color:var(--fg3);font-size:10.5px;padding:2px 7px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button[aria-pressed=true]{background:#1d2733;color:var(--fg)}
  /* 列表视图 */
  .group{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel)}
  .group>summary{list-style:none;cursor:pointer;padding:7px 9px;display:flex;align-items:center;gap:7px;
    font-size:11px;color:var(--fg2);background:var(--card)}
  .group>summary::-webkit-details-marker{display:none}
  .group>summary .n{color:var(--fg3)}
  .group .gin{padding:8px}
  .moveto{margin:2px 0 10px;display:flex;gap:6px;align-items:center;color:var(--fg3);font-size:10px}
  .moveto select{appearance:none;background:var(--card);border:1px solid var(--line2);color:var(--fg2);
    border-radius:6px;font-size:10.5px;padding:1px 6px}
  /* 详情 */
  .overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
  .dhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .back{background:transparent;border:0;color:var(--fg2);font-size:16px;cursor:pointer;line-height:1}
  .back:hover{color:var(--fg)}
  .dbody{flex:1;overflow:auto;padding:12px}
  .dtitle{font-size:13px;margin:0 0 10px;line-height:1.4;font-weight:600}
  .frow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:11px;color:var(--fg2)}
  .frow .k{min-width:44px;color:var(--fg3);flex:0 0 44px}
  .stbtns{display:flex;flex-wrap:wrap;gap:4px}
  .stbtn{border:1px solid var(--line);background:var(--card);color:var(--fg2);border-radius:999px;
    padding:1px 8px;font-size:10.5px;cursor:pointer}
  .stbtn[aria-pressed=true]{background:#1d2733;border-color:#3b5163;color:var(--fg)}
  .sec{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
  .sec h4{font-size:10.5px;color:var(--fg3);margin:0 0 6px;font-weight:600}
  .desc{font-size:11.5px;line-height:1.65;color:var(--fg2);white-space:pre-wrap}
  .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .acts .btn{background:var(--card);border:1px solid var(--line2);color:var(--fg2);border-radius:7px;
    font-size:11px;padding:3px 8px;cursor:pointer}
  .acts .btn.pri{background:#1d2733;border-color:#3b5163;color:#dbe6f0}
  .inlineD{border-top:1px dashed var(--line2);margin-top:8px;padding-top:8px}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--fg3);margin-bottom:8px}
  .fld select,.fld input[type=text]{background:var(--card);border:1px solid var(--line2);border-radius:7px;
    color:var(--fg);font-size:11.5px;padding:4px 6px;width:100%}
  .fld .wt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fld .wt input[type=text]{flex:1;min-width:70px;width:auto}
  textarea{width:100%;height:56px;background:var(--card);border:1px solid var(--line2);border-radius:8px;
    color:var(--fg);font:11.5px/1.6 inherit;padding:6px 8px;resize:vertical}
  .pv{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin:0;
    font:10.5px/1.6 ui-monospace,Menlo,monospace;color:var(--fg2);white-space:pre-wrap;max-height:110px;overflow:auto}
  .acts .btn:disabled{opacity:.6;cursor:default}
  .card.sel{border-color:#3b5163;background:#141c25}
  .card:focus-visible{outline:2px solid #3b5163;outline-offset:1px}
  /* 看板 */
  .board{display:flex;gap:8px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
  .col{flex:0 0 168px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;min-height:80px}
  .col.over{border-color:#3f6ea8;background:#101823}
  .col h2{font-size:10.5px;margin:0 0 7px;color:var(--fg2);font-weight:600;display:flex;gap:6px;align-items:center}
  .col h2 .n{color:var(--fg3);font-weight:400}
  .drop{display:flex;flex-direction:column;gap:6px;min-height:44px}
  .blank{color:var(--fg3);font-size:10.5px;text-align:center;padding:8px 0;border:1px dashed var(--line2);border-radius:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:grab}
  .card:hover{border-color:var(--line2)}
  .card.dragging{opacity:.45}
  .card .t{font-size:11.5px;line-height:1.4;margin-bottom:5px;color:var(--fg)}
  .card .meta{display:flex;align-items:center;gap:5px;color:var(--fg3);font-size:10px}
  .ident{font-variant-numeric:tabular-nums;color:var(--fg3)}
  .chip{border-radius:999px;padding:0 5px;font-size:9.5px;line-height:15px;border:1px solid transparent}
  .p-urgent{color:#f87171;border-color:#3d2224;background:#241618}
  .p-high{color:#fbbf24;border-color:#3d3320;background:#241f14}
  .p-med{color:#60a5fa;border-color:#213341;background:#141e26}
  .p-low{color:#6b7482;border-color:#2a3038;background:#191d22}
  .avatar{width:15px;height:15px;border-radius:50%;background:#2b3542;color:#c7d2de;font-size:8.5px;
    display:inline-flex;align-items:center;justify-content:center}
  .sess{color:#a78bfa;border-color:#35295a;background:#1b1630}
  .toast{position:sticky;bottom:0;margin:8px 0 0;display:flex;align-items:center;gap:8px;
    background:#1b2129;border:1px solid var(--line2);border-radius:9px;padding:7px 9px;font-size:11px;color:var(--fg2)}
  .toast.bad{border-color:#4a2326;background:#241618;color:#f87171}
  .toast button{margin-left:auto;background:transparent;border:0;color:#7dd3fc;font-size:11px;cursor:pointer}
  .diag{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;color:var(--fg3);font-size:10.5px}
  .diag summary{cursor:pointer;outline:none}
  .diag div{margin-top:4px;word-break:break-word}
  .diag ol{margin:4px 0 0;padding-left:16px}
</style>
</head>
<body data-theme="dark">
  <header>
    <span class="dot" id="dot"></span>
    <h1>Plane</h1>
    <span class="grow"></span>
    <div class="seg" id="seg" hidden>
      <button type="button" data-view="board" aria-pressed="true">列</button>
      <button type="button" data-view="list">列表</button>
    </div>
    <select id="proj" hidden></select>
    <button id="refresh" type="button" title="重新拉取">↻</button>
  </header>
  <div id="crash" class="crash" hidden></div>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>
  <footer>
    <span>宿主</span><span id="hostState">—</span>
    <span>· service</span><span id="svcState">—</span>
    <span class="grow"></span>
    <span>配置在扩展数据目录</span>
  </footer>
  <script src="./main.js"></script>
</body>
</html>
