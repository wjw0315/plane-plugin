<!DOCTYPE html>
<!-- 测试用假宿主：把 panel/index.html 放进 iframe，按 SDK 的 postMessage 协议应答。
     只为验证面板自身逻辑（发不发请求、状态怎么变），不连真实 OpenChamber。
     用法：在 openchamber/ 目录起 http 服务，打开 test/host-harness.html -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>假宿主 · Plane 面板测试台</title>
<style>
  body{margin:0;background:#0b0d10;color:#c9d3de;font:12px/1.6 ui-monospace,Menlo,monospace}
  .row{display:flex;height:100vh}
  .frame{flex:0 0 400px;border-right:1px solid #232a33;background:#0d0f12}
  iframe{width:100%;height:100%;border:0}
  .log{flex:1;overflow:auto;padding:10px 12px}
  .log b{color:#7dd3fc;font-weight:600}
  .m{padding:3px 0;border-bottom:1px solid #171d24;white-space:pre-wrap;word-break:break-all}
  .ok{color:#4ade80}
  .err{color:#f87171}
</style>
</head>
<body>
<div class="row">
  <div class="frame">
    <div style="display:flex;gap:6px;padding:6px;border-bottom:1px solid #232a33">
      <button id="fill">1. 填测试值</button>
      <button id="go">2. 点「保存并连接」</button>
    </div>
    <iframe id="panel" src="../panel/index.html" style="height:calc(100% - 34px)"></iframe>
  </div>
  <div class="log" id="log"></div>
</div>
<script>
// 最早的错误钩子：模块加载失败也要看得见
window.__errs = [];
function paintErr(text) {
  window.__errs.push(text);
  var d = document.createElement("pre");
  d.className = "err";
  d.textContent = "!! " + text;
  document.body.appendChild(d);
}
window.addEventListener("error", function (e) { paintErr("error: " + (e.message || e.type)); });
window.addEventListener("unhandledrejection", function (e) { paintErr("rejection: " + (e.reason && e.reason.message || e.reason)); });
</script>
<script type="module">
import { EMPTY_GUEST_CONNECTION, OPENCHAMBER_SDK_CHANNEL, OPENCHAMBER_SDK_API_VERSION } from "../node_modules/@openchamber/sdk/dist/index.js";

const CHANNEL = OPENCHAMBER_SDK_CHANNEL;
const V = OPENCHAMBER_SDK_API_VERSION;
const logEl = document.getElementById("log");
const frame = document.getElementById("panel");

// 假 service 的状态：点「保存并连接」后变成已配置 + 有项目
const fake = { configured: false, projects: [] };

function log(text, cls = "") {
  const el = document.createElement("div");
  el.className = "m " + cls;
  el.textContent = text;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

const ctx = {
  theme: { mode: "dark", tokens: {} },
  locale: "zh-CN",
  directory: "/tmp",
  session: null,
  surface: "panel",
  connection: EMPTY_GUEST_CONNECTION,
  settings: {},
  item: null,
};

function reply(id, payload) {
  frame.contentWindow.postMessage({ channel: CHANNEL, v: V, type: "result", id, ok: true, payload }, "*");
}
function replyErr(id, error) {
  frame.contentWindow.postMessage({ channel: CHANNEL, v: V, type: "result", id, ok: false, error }, "*");
}

function routeService(p) {
  const path = p.path || "";
  log(`  → service ${p.method} ${path} body=${p.body || "-"}`);
  if (path === "/config" && p.method === "GET") {
    return { status: 200, body: JSON.stringify({ ok: true, config: { configured: fake.configured, baseUrl: fake.configured ? "http://192.168.1.188:8080" : "", workspace: fake.configured ? "g2" : "", apiVersion: "v1", hasKey: fake.configured } }) };
  }
  if (path === "/config" && p.method === "POST") {
    fake.configured = true;
    return { status: 200, body: JSON.stringify({ ok: true, config: { configured: true, baseUrl: "http://192.168.1.188:8080", workspace: "g2", apiVersion: "v1", hasKey: true } }) };
  }
  if (path === "/projects") {
    if (!fake.configured) return { status: 400, body: JSON.stringify({ ok: false, error: { code: "CONFIG_MISSING", message: "还缺：apiKey" } }) };
    fake.projects = [{ id: "p1", name: "xlm-scrm", identifier: "XLMSC" }, { id: "p2", name: "内部", identifier: "IN" }];
    return { status: 200, body: JSON.stringify({ ok: true, projects: fake.projects }) };
  }
  return { status: 404, body: JSON.stringify({ ok: false, error: { code: "NOT_FOUND", message: path } }) };
}

window.addEventListener("message", (e) => {
  if (e.source !== frame.contentWindow) return;
  const m = e.data;
  if (!m || m.channel !== CHANNEL) return;
  log(`guest → host  ${m.type}${m.id ? " #" + m.id : ""}`);

  switch (m.type) {
    case "hello":
      frame.contentWindow.postMessage({ channel: CHANNEL, v: V, type: "ready", payload: ctx }, "*");
      log("host → guest  ready", "ok");
      return;
    case "service-request":
      return reply(m.id, routeService(m.payload || {}));
    case "service-status":
      return reply(m.id, { status: "ready" });
    case "storage": {
      const p = m.payload || {};
      log(`  storage.${p.op} key=${p.key ?? "-"} value=${JSON.stringify(p.value ?? null)}`);
      if (p.op === "get") return reply(m.id, { storage: true, op: "get", found: false });
      if (p.op === "set") return reply(m.id, { storage: true, op: "set", saved: true });
      if (p.op === "delete") return reply(m.id, { storage: true, op: "delete", deleted: true });
      return reply(m.id, { storage: true, op: "keys", keys: [] });
    }
    case "toast":
      log("  toast: " + JSON.stringify(m.payload), "ok");
      return reply(m.id, { shown: true });
    default:
      log("  (未处理的调用，回空结果)", "err");
      return replyErr(m.id, "HARNESS_UNHANDLED");
  }
});

// 真宿主在 iframe 加载完就推 ready（不等 hello）；模块脚本是 deferred，
// 可能晚于面板的 hello，所以两边都推一次。
function pushReady() {
  if (!frame.contentWindow) return;
  frame.contentWindow.postMessage({ channel: CHANNEL, v: V, type: "ready", payload: ctx }, "*");
  log("host → guest  ready (push)", "ok");
}
function fillPanel() {
  const d = frame.contentDocument;
  if (!d) return log("填值失败：读不到 iframe", "err");
  const set = (name, value) => {
    const el = d.querySelector(`input[name="${name}"]`);
    if (!el) return log(`填值失败：没有 ${name}`, "err");
    el.value = value;
    el.dispatchEvent(new Event("input", { bubbles: true }));
  };
  set("baseUrl", "http://192.168.1.188:8080");
  set("apiKey", "plane_api_harness");
  set("workspace", "g2");
  set("apiVersion", "v1");
  log("已把测试值填进面板表单", "ok");
}
window.fillPanel = fillPanel;
document.getElementById("fill").addEventListener("click", fillPanel);
document.getElementById("go").addEventListener("click", () => {
  const btn = frame.contentDocument?.querySelector("#setupForm button[type=submit]");
  if (!btn) return log("点不到保存按钮（面板可能不在表单态）", "err");
  btn.click();
  log("已点击面板的保存按钮", "ok");
});
if (frame.contentDocument?.readyState === "complete") pushReady();
frame.addEventListener("load", pushReady);

log("假宿主就绪，等待面板 hello…");
</script>
</body>
</html>
